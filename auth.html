<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b8c55d"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/css/style.css"><title>OLIVA — вход</title></head><body>
<div class="page-shell"><div class="auth-wrap panel"><section class="auth-art"><a href="index.html" class="brand"><img src="assets/img/logo.png" alt="OLIVA"><span>OLIVA</span></a><h1>Цветы любят тех, кто возвращается.</h1><p style="line-height:1.7;max-width:420px">В личном кабинете хранятся баллы, история заказов и персональные купоны.</p><svg viewBox="0 0 400 260" style="position:absolute;width:80%;bottom:-20px;right:-30px"><path d="M200 260C202 190 196 125 203 52M204 150C150 137 120 105 89 57M202 181C255 166 291 132 316 84" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/><circle cx="202" cy="48" r="50" fill="none" stroke="#fff" stroke-width="3"/><circle cx="89" cy="57" r="32" fill="none" stroke="#fff" stroke-width="3"/><circle cx="316" cy="84" r="38" fill="none" stroke="#fff" stroke-width="3"/></svg></section><section class="auth-form"><div class="tabs"><button class="active" data-auth-tab="login">Вход</button><button data-auth-tab="register">Регистрация</button></div><div id="loginForm"><h2 style="font-family:Georgia,serif;font-size:42px;font-weight:400">С возвращением ✿</h2><div class="field"><label>Email</label><input id="loginEmail" type="email" placeholder="you@example.com"></div><div class="field"><label>Пароль</label><input id="loginPass" type="password" placeholder="••••••••"></div><button class="btn btn-primary" id="loginBtn" style="width:100%;margin-top:8px">Войти</button><p style="font-size:12px;color:var(--muted)">Демо: можно войти с любым email и паролем.</p></div><div id="registerForm" style="display:none"><h2 style="font-family:Georgia,serif;font-size:42px;font-weight:400">В OLIVA CLUB</h2><div class="field"><label>Имя</label><input id="regName" placeholder="Ваше имя"></div><div class="field"><label>Email</label><input id="regEmail" type="email" placeholder="you@example.com"></div><div class="field"><label>Пароль</label><input id="regPass" type="password" placeholder="от 6 символов"></div><button class="btn btn-lime" id="regBtn" style="width:100%;margin-top:8px">Создать аккаунт</button></div><a href="index.html" style="display:inline-block;margin-top:24px;color:var(--muted)">← Вернуться на главную</a></section></div></div>
<script>
const tabs=[...document.querySelectorAll('[data-auth-tab]')];tabs.forEach(b=>b.onclick=()=>{tabs.forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#loginForm').style.display=b.dataset.authTab==='login'?'block':'none';document.querySelector('#registerForm').style.display=b.dataset.authTab==='register'?'block':'none'});
function go(name,email){localStorage.olivaUser=JSON.stringify({name:name||email.split('@')[0],email,points:Number(localStorage.olivaPoints||2750)});location.href='account.html'}
document.querySelector('#loginBtn').onclick=()=>{const e=document.querySelector('#loginEmail').value.trim();if(!e)return alert('Введите email');go('',e)};
document.querySelector('#regBtn').onclick=()=>{const n=document.querySelector('#regName').value.trim(),e=document.querySelector('#regEmail').value.trim();if(!n||!e)return alert('Заполните имя и email');localStorage.olivaPoints='1000';go(n,e)};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
